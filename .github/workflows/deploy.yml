name: Deploy to Cloudflare

# Builds the site and deploys it, with the www redirect in worker.js, to https://migueljfsc.dev.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — Account · Workers Scripts · Edit, and Zone · Workers Routes · Edit
#                            on migueljfsc.dev (for the custom domains)
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; queue rather than cancel a half-finished one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://migueljfsc.dev
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          command: deploy
