name: Deploy to Cloudflare

# Builds the site and deploys it as a static-assets Worker to https://migueljfsc.dev.
#
# WHY WRANGLER AND NOT OPENTOFU. Deploying static assets is an upload of file hashes that ends
# in a completion token Cloudflare expires after an hour; Terraform can neither produce it nor
# hold it in state. The zone around the site — the www redirect — is OpenTofu, in
# infrastructure/terraform/cloudflare, applied by terraform.yml.
#
# Required repository secrets (permissions in infrastructure/terraform/cloudflare/README.md):
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    # The stack is terraform.yml's; changing it alone does not redeploy the site.
    paths-ignore:
      - "infrastructure/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; queue rather than cancel a half-finished one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://migueljfsc.dev
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.1"
          command: deploy
